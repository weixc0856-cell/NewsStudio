# YouTube extraction: enable JS runtime + remote challenge solver
# (without these, some high-res formats / n-sig may be missing)
--js-runtimes node
--remote-components ejs:github

# Highest quality: best video + best audio, prefer VP9 (highest bitrate, widest decode support)
-f bv*+ba/b
-S "res,fps,hdr:12,vcodec:vp9.2:vp9:av01:h264,acodec:opus:aac"

# Output
-P downloads
-o "%(title)s [%(id)s].%(ext)s"
--merge-output-format mkv
--embed-metadata

# Network robustness
--retries 10
--fragment-retries 10
--concurrent-fragments 4
# Larger HTTP chunks avoid YouTube's per-request throttling
--http-chunk-size 10M
