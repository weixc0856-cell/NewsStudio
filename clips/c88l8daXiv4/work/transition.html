<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GPU闲置成本高于CPU</title>
<style>
  :root {
    --bg: #0b0e13;
    --ink: #f2f5f8;
    --muted: #93a0b1;
    --faint: #5e6b7c;
    --line: #222b37;
    --accent: #ff5500;
    --mono: "IBM Plex Mono", "Consolas", "SFMono-Regular", "Menlo", monospace;
    --sans: "Helvetica Neue", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px;
    overflow: hidden; background: var(--bg);
  }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1920px; height: 1080px; background: var(--bg); }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.030) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(1100px 700px at 50% 46%, transparent 0%, rgba(0,0,0,.38) 100%);
  }
  .accent-bar {
    position: absolute; left: 0; top: 0; width: 4px; height: 1080px; background: var(--accent);
  }
  .top {
    position: absolute; left: 120px; right: 120px; top: 82px;
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: var(--mono); font-size: 19px; letter-spacing: 2.6px;
    text-transform: uppercase; color: var(--faint);
  }
  .top .series { color: var(--muted); }
  .rule { position: absolute; left: 120px; right: 120px; height: 1px; background: var(--line); }
  .rule.top-rule { top: 142px; }
  .rule.bottom-rule { bottom: 134px; }

  .center {
    position: absolute; left: 160px; right: 160px; top: 50%;
    transform: translateY(-50%);
    display: flex; align-items: center; gap: 64px;
  }
  .num {
    font-family: var(--mono); font-size: 190px; font-weight: 700;
    line-height: .9; letter-spacing: -8px; color: var(--accent);
    flex: 0 0 auto;
  }
  .copy { border-left: 1px solid var(--line); padding-left: 56px; }
  .kicker {
    font-family: var(--mono); font-size: 21px; letter-spacing: 4px;
    color: var(--muted); text-transform: uppercase;
  }
  .title {
    margin-top: 22px; font-size: 64px; font-weight: 800; line-height: 1.25;
    color: var(--ink); max-width: 1120px;
  }
  .foot {
    position: absolute; left: 120px; right: 120px; bottom: 72px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 19px; letter-spacing: 2.2px;
    color: var(--faint); text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="accent-bar"></div>

  <div class="top">
    <div class="series">AI 基建 / 第 21 期</div>
    <div>HIGHLIGHTS / NEXT</div>
  </div>
  <div class="rule top-rule"></div>

  <div class="center">
    <div class="num">02</div>
    <div class="copy">
      <div class="kicker">高光片段</div>
      <div class="title">GPU闲置成本高于CPU</div>
    </div>
  </div>

  <div class="rule bottom-rule"></div>
  <div class="foot">
    <div>AI 基建 / 第 21 期</div>
    <div>16:9 / 1920×1080</div>
  </div>
</div>
</body>
</html>
